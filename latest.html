<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>晨间简报 · 最新一期</title>
<style>
  body{margin:0;padding:64px 20px;background:#FCFCFB;color:#6B6A63;text-align:center;
       font:14px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:#C6613F;text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<p>正在打开最新一期……</p>
<p><a href="./">打不开的话，点这里看全部日报</a></p>
<script>
(function () {
  fetch('latest.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var d = j && j.date;
      location.replace(/^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d + '.html' : './');
    })
    .catch(function () { location.replace('./'); });
})();
</script>
</body>
</html>

<!DOCTYPE html>

<head>

<title>晨间简报 · 归档</title>
<style>
  :root{
    --bg:#FCFCFB; --wash:#F9F9F7; --ink:#2E2C27; --ink-soft:#6B6A63;
    --ink-grey:#B4B3A8; --hairline:#E4E3DC; --edge:#E1E1DF; --clay:#C6613F;
    --sans:-apple-system,"Segoe UI",sans-serif;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",STSong,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .band--top{background:var(--wash);border-bottom:1px solid var(--edge)}
  .inner{max-width:860px;margin:0 auto;padding:54px 32px 44px}
  .band--bottom .inner{padding:44px 32px 72px}
  .kicker{font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 14px}
  h1{font-family:var(--serif);font-weight:600;font-size:36px;line-height:1.3;margin:0;text-wrap:balance}
  ul{list-style:none;margin:0;padding:0}
  li{border-bottom:1px solid var(--hairline)}
  li a{display:flex;gap:20px;align-items:baseline;padding:16px 0;text-decoration:none;color:var(--ink)}
  li a:hover .t{text-decoration:underline;text-decoration-color:var(--ink-grey);text-underline-offset:3px}
  .d{flex:0 0 118px;font-size:12.5px;color:var(--ink-grey);font-variant-numeric:tabular-nums}
  .t{font-size:15px;font-weight:600;line-height:1.55}
  .files{padding:0 0 15px 138px;margin-top:-6px}
  .files a{font-size:12.5px;color:var(--clay);text-decoration:none;margin-right:16px}
  .files a:hover{text-decoration:underline;text-underline-offset:3px}
  .empty{font-size:14px;line-height:1.75;color:var(--ink-soft);margin:0}
  @media (max-width:640px){
    .inner{padding:38px 20px 30px}
    .band--bottom .inner{padding:30px 20px 52px}
    h1{font-size:28px}
    li a{display:block;padding:14px 0}
    .d{margin-bottom:4px}
  }
</style>
<script src="live.js?v=3" defer></script>
</head>
